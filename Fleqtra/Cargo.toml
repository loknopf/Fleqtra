[package]
name = "Fleqtra"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = "0.7.13"
deadpool-postgres = "0.10"
dotenvy = "0.15" # for .env support
axum-extra = {version = "0.10.1", features = ["multipart"]}
argon2 = "0.5.3"
rand = "0.9"
jsonwebtoken = "9.3.1"
uuid = "1.17.0"
log = "0.4.27"
env_logger = "0.11.8"
